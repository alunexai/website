name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      - name: Install, build, and upload your site
        uses: withastro/action@v2
        with:
          node-version: "24"
        env:
          # Supabase publishable key — safe to expose (RLS, not key secrecy,
          # protects data). Same project the iOS insider-trading-app uses.
          PUBLIC_SUPABASE_URL: https://xkobcymztzpievdxchqc.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b9k3kn8LkaW7DH-3gGo2tg_DaGedeWU

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4