name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 8.14.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Supabase publishable key — safe to expose (RLS, not key secrecy,
          # protects data). Same project the iOS insider-trading-app uses.
          PUBLIC_SUPABASE_URL: https://xkobcymztzpievdxchqc.supabase.co
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_b9k3kn8LkaW7DH-3gGo2tg_DaGedeWU
